<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MoodMix</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><main><header><div><p class="eyebrow">MOODMIX</p><h1>Your mood,<br><em>on repeat.</em></h1><p class="sub">A thoughtful Spotify playlist shaped around how you feel right now.</p></div><div id="mode" class="mode">Checking catalog…</div></header>
<section class="panel"><form id="form"><label for="mood">What’s the mood?</label><input id="mood" required placeholder="e.g. sunny, optimistic morning"><div class="examples"><button type="button" data-mood="calm evening focus">calm evening</button><button type="button" data-mood="energetic workout">energetic workout</button><button type="button" data-mood="nostalgic and bittersweet">nostalgic</button></div><div class="grid"><label>Genres <input id="genres" placeholder="indie, jazz"></label><label>Artists <input id="artists" placeholder="SZA, Radiohead"></label><label>Reference songs <input id="songs" placeholder="one or more song titles"></label></div><button class="submit" type="submit">Build my playlist <span>↗</span></button></form></section>
<section id="status" class="status"></section><section id="playlist" class="playlist"></section></main><script src="/static/app.js"></script></body></html>
